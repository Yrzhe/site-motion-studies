<header>ONE EFFECT: <b>TODO — one sentence naming the mechanism</b>. Scroll and watch the numbers.</header>
<div id="hud"><div>p <b id="hp">0.00</b></div></div>

<div id="track"><div id="stage"><div id="obj"></div></div></div>

<script>
/* Explain the mechanism in a comment here — the demo teaches, it does not decorate. */
const track = document.getElementById('track');
const obj = document.getElementById('obj');
const hp = document.getElementById('hp');
function onScroll(){
  const r = track.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
  obj.style.transform = `translateY(${-p * 100}px)`;   // TODO: the effect
  hp.textContent = p.toFixed(2);
}
addEventListener('scroll', onScroll, {passive:true});
onScroll();
</script>
