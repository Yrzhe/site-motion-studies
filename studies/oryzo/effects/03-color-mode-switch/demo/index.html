<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effect: semantic color mode switch</title>
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:ui-monospace,Menlo,monospace;color:#111}
  header{position:fixed;top:0;left:0;right:0;padding:10px 14px;font-size:12px;background:#fff;border-bottom:1px solid #ddd;z-index:2}
  header b{color:#2563eb}

  /* THE WHOLE EFFECT: one data attribute swaps a set of CSS variables.
     Every colored thing reads only variables. Nothing else changes. */
  #stage{--bg:#f4f4f4; --obj:#111; --label:#666; --accent:#2563eb}
  #stage[data-mode="thermal"]{--bg:#2a1636; --obj:#ff7a1a; --label:#caa6e8; --accent:#3be8ff}
  #stage[data-mode="legacy"] {--bg:#b4522e; --obj:#2c1a12; --label:#f3d3b8; --accent:#ffe08a}

  #track{height:450vh}
  #stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);transition:background .6s}
  #obj{width:110px;height:110px;border-radius:50%;background:var(--obj);transition:background .6s}
  .lab{position:absolute;font-size:12px;color:var(--label);transition:color .6s}
  #l1{top:20%;left:16%} #l2{bottom:22%;right:16%}
  .lab b{color:var(--accent);transition:color .6s}

  #hud{position:fixed;right:14px;top:52px;font-size:12px;line-height:1.9;background:#fff;border:1px solid #ddd;padding:10px 12px;z-index:2}
  #hud b{color:#2563eb}
</style>

<header>ONE EFFECT: <b>one attribute → whole scene re-colors</b>. Layout and object never move; only CSS variables change.</header>

<div id="hud">mode <b id="hm">normal</b></div>

<div id="track"><div id="stage" data-mode="normal">
  <div class="lab" id="l1">OBJECT-01 · <b>STABLE</b></div>
  <div id="obj"></div>
  <div class="lab" id="l2">MODE / <b id="modeLabel">NORMAL</b></div>
</div></div>

<script>
/* Color as MEANING, not decoration.
   Each scroll third sets data-mode on the stage. All colors live in CSS
   variables scoped to [data-mode], so one attribute swap restyles the whole
   scene in sync — background, object, labels, accent. No per-element JS. */

const MODES = ['normal', 'thermal', 'legacy'];
const track = document.getElementById('track');
const stage = document.getElementById('stage');
const hm = document.getElementById('hm'), ml = document.getElementById('modeLabel');

function onScroll(){
  const r = track.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
  const mode = MODES[Math.min(MODES.length - 1, Math.floor(p * MODES.length))];
  if (stage.dataset.mode !== mode){
    stage.dataset.mode = mode;
    hm.textContent = mode;
    ml.textContent = mode.toUpperCase();
  }
}
addEventListener('scroll', onScroll, {passive:true});
onScroll();
</script>
</html>
