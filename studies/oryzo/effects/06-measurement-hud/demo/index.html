<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effect: measurement HUD labels</title>
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:ui-monospace,Menlo,monospace;background:#f4f4f4;color:#111}
  header{position:fixed;top:0;left:0;right:0;padding:10px 14px;font-size:12px;background:#fff;border-bottom:1px solid #ddd;z-index:2}
  header b{color:#2563eb}

  #track{height:400vh}
  #stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;gap:60px}

  #obj{width:100px;height:100px;border-radius:50%;background:#111}

  /* the HUD: a ruler whose ticks + numbers are DERIVED from state.
     mono font, one accent, everything else gray. that's the whole look. */
  #ruler{display:flex;flex-direction:column-reverse;gap:14px}
  .tick{display:flex;align-items:center;gap:8px;font-size:11px;color:#bbb}
  .tick i{display:block;width:18px;height:1px;background:#ccc}
  .tick.on{color:#2563eb;font-weight:700}
  .tick.on i{background:#2563eb;height:2px}

  #readout{position:absolute;margin-left:220px;font-size:12px;color:#666}
  #readout b{color:#2563eb;font-size:16px}
</style>

<header>ONE EFFECT: <b>labels behave like measurement</b>. Numbers/ticks are derived from state; only the active tick gets the accent.</header>

<div id="track"><div id="stage">
  <div id="obj"></div>
  <div id="ruler"></div>
  <div id="readout">ELEVATION<br><b id="val">000</b> mm</div>
</div></div>

<script>
/* Oryzo's labels feel like instrumentation, not decoration, because:
   1. they are MONO and tiny (measurement register)
   2. their values are DERIVED from the actual state (not hand-written)
   3. only the ACTIVE value carries the accent color — everything else gray
   4. the label grid itself never animates; only which tick is "on" changes

   Here: object rises with scroll; a ruler tracks it. The ruler doesn't
   move — its ticks light up as the value passes them. */

const TICKS = 10;
const ruler = document.getElementById('ruler');
for (let i = 0; i <= TICKS; i++){
  const t = document.createElement('div');
  t.className = 'tick';
  t.innerHTML = `<i></i>${String(i*10).padStart(3,'0')}`;
  ruler.appendChild(t);
}
const ticks = [...ruler.children];

const track = document.getElementById('track');
const obj = document.getElementById('obj');
const val = document.getElementById('val');

function onScroll(){
  const r = track.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));

  obj.style.transform = `translateY(${-p * 120}px)`;      // the measured thing
  val.textContent = String(Math.round(p * 100)).padStart(3, '0');
  const active = Math.round(p * TICKS);
  ticks.forEach((t, i) => t.classList.toggle('on', i === active));
}
addEventListener('scroll', onScroll, {passive:true});
onScroll();
</script>
</html>
