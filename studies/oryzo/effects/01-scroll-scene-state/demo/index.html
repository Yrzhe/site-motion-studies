<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effect: scroll scene state machine</title>
<style>
  /* Minimal on purpose. Gray page, black object, one accent. No decoration. */
  *{margin:0;box-sizing:border-box}
  body{font-family:ui-monospace,Menlo,monospace;background:#f4f4f4;color:#111}
  header{position:fixed;top:0;left:0;right:0;padding:10px 14px;font-size:12px;background:#fff;border-bottom:1px solid #ddd;z-index:2}
  header b{color:#2563eb}

  /* The scroll track is the only tall element. The stage stays pinned. */
  #track{height:600vh}
  #stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center}

  #box{width:120px;height:120px;background:#111;border-radius:10px}

  /* Live numbers — this is the whole point of the demo. */
  #hud{position:fixed;right:14px;top:52px;font-size:12px;line-height:1.9;background:#fff;border:1px solid #ddd;padding:10px 12px}
  #hud b{display:inline-block;width:64px;color:#2563eb}
  #beats{position:fixed;left:14px;top:52px;font-size:12px;line-height:1.9}
  #beats span{display:block;color:#999}
  #beats span.on{color:#2563eb;font-weight:700}
</style>

<header>ONE EFFECT: <b>global scroll → beat index → local progress</b>. Scroll and watch the numbers. Each beat owns ONE action.</header>

<div id="beats">
  <span>beat 0 · slide</span><span>beat 1 · lift</span><span>beat 2 · rotate</span><span>beat 3 · scale</span>
</div>

<div id="hud">
  <div>global <b id="hg">0.00</b></div>
  <div>beat &nbsp;&nbsp;<b id="hb">0</b></div>
  <div>local &nbsp;<b id="hl">0.00</b></div>
</div>

<div id="track"><div id="stage"><div id="box"></div></div></div>

<script>
/* The entire mechanism is these ~20 lines.

   1. global : how far the whole track has scrolled (0..1)
   2. beat   : which scene owns the scroll right now (0..N-1)
   3. local  : progress WITHIN that beat (0..1) — this drives the motion

   The split is the lesson: global owns page travel, local owns the
   current physical action. Mixing them is why scrolly demos feel mushy. */

const BEATS = 4;
const track = document.getElementById('track');
const box   = document.getElementById('box');
const spans = document.querySelectorAll('#beats span');
const hg = document.getElementById('hg'), hb = document.getElementById('hb'), hl = document.getElementById('hl');

function onScroll(){
  const r = track.getBoundingClientRect();
  const global = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));

  const beat  = Math.min(BEATS - 1, Math.floor(global * BEATS));
  const local = Math.min(1, global * BEATS - beat);

  // one action per beat, all driven by LOCAL progress
  const t = [
    `translateX(${local * 160}px)`,                    // beat 0: slide
    `translateX(160px) translateY(${local * -120}px)`, // beat 1: lift
    `translateX(160px) translateY(-120px) rotate(${local * 180}deg)`,          // beat 2: rotate
    `translateX(160px) translateY(-120px) rotate(180deg) scale(${1 + local})`, // beat 3: scale
  ];
  box.style.transform = t[beat];

  hg.textContent = global.toFixed(2);
  hb.textContent = beat;
  hl.textContent = local.toFixed(2);
  spans.forEach((s, i) => s.classList.toggle('on', i === beat));
}
addEventListener('scroll', onScroll, {passive:true});
onScroll();
</script>
</html>
